# CA-R40 — smoke vídeo + bootstrap + DMG macOS (CAD-164)
name: CA-R40 macOS

on:
  workflow_dispatch:
  push:
    branches: [master, main, '**/cad-164**', '**/refactor**']
    paths:
      - '.github/workflows/car40-macos.yml'
      - 'scripts/smoke-car40.mjs'
      - 'scripts/smoke-fase2.mjs'
      - 'scripts/smoke-fase8.mjs'
      - 'server/**'
      - 'electron/**'
      - 'electron-builder.yml'
      - 'package.json'
      - 'package-lock.json'

jobs:
  smoke-and-dmg:
    name: smoke + DMG (macos-latest)
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CA-R40 video pipeline smoke
        run: npm run test:video-pipeline

      - name: Bootstrap smoke (~/livepraise seed)
        run: npm run smoke:bootstrap

      - name: Release smoke (socket + bootstrap limpo)
        run: npm run smoke:fase8

      - name: Verify auto-updater wiring in electron main
        run: |
          npm run build:electron
          node --input-type=module -e "
            import fs from 'node:fs';
            const main = fs.readFileSync('dist/electron/main.js', 'utf8');
            if (!main.includes('setupAutoUpdater')) {
              throw new Error('setupAutoUpdater not referenced in electron main bundle');
            }
            console.log('auto-updater wiring OK');
          "

      - name: Build macOS DMG (x64 + arm64)
        run: npm run dist:mac
        env:
          CI: true

      - name: List release artefacts
        run: ls -la release-builds/

      - name: Upload DMG artefacts
        uses: actions/upload-artifact@v4
        with:
          name: livepraise-macos-dmg
          path: release-builds/*.dmg
          if-no-files-found: error

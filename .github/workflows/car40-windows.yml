# CA-R40: smoke pipeline + NSIS Windows x64 (CAD-163)
name: CA-R40 Windows

on:
  workflow_dispatch:
  push:
    branches: [master, main]
    paths:
      - '**'
  pull_request:
    branches: [master, main]

jobs:
  windows-smoke-build:
    name: smoke + dist:win
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: CA-R40 video pipeline smoke
        run: npm run test:video-pipeline

      - name: Bootstrap smoke
        run: npm run smoke:bootstrap

      - name: Build NSIS installer
        run: npm run dist:win
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify artifacts
        shell: pwsh
        run: |
          $yml = Get-ChildItem release-builds/latest*.yml -ErrorAction SilentlyContinue
          if (-not $yml) { throw 'missing latest*.yml (electron-updater metadata)' }
          $exe = Get-ChildItem 'release-builds/Live Praise Setup *.exe' | Select-Object -First 1
          if (-not $exe) { throw 'missing NSIS installer' }
          if ($exe.Length -lt 50MB) { throw "NSIS too small: $($exe.Length) bytes" }
          $ff = 'release-builds/win-unpacked/resources/app.asar.unpacked/node_modules/ffmpeg-static/ffmpeg.exe'
          if (-not (Test-Path $ff)) { throw "missing $ff" }
          Get-ChildItem release-builds/*.exe, release-builds/latest*.yml | Format-Table Name, Length

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: livepraise-win-${{ github.sha }}
          path: |
            release-builds/
          retention-days: 14

appId: com.cadimos.livepraise
productName: Live Praise
copyright: Copyright © Cadimos
npmRebuild: false
# Sem ASAR: binários nativos (ffmpeg-static, yt-dlp) e paths de ficheiro funcionam de forma fiável no Windows.
asar: false
directories:
  output: release-builds
  buildResources: resources
files:
  - dist/**/*
  - web/**/*
  - themes/**/*
  - resources/fonts/**/*
  - resources/icon/**/*
  - locales/**/*
  - openapi.yaml
  - electron/splash/**/*
  - vendor/yt-dlp/**/*
  - node_modules/ffmpeg-static/**/*
  - package.json
extraResources:
  - from: install/
    to: install/
    filter:
      - '**/*'
publish:
  - provider: github
    owner: cadimos
    repo: livepraise
    releaseType: release
nsis:
  installerIcon: resources/icon/livepraise.ico
  uninstallerIcon: resources/icon/livepraise.ico
  installerHeaderIcon: resources/icon/livepraise.ico
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: resources/icon/livepraise.ico
  # Evita winCodeSign (symlinks no Windows sem privilégio de admin). Ícone do .exe via afterPack.
  signAndEditExecutable: false
afterPack: scripts/electron-after-pack.mjs
linux:
  target:
    - target: AppImage
      arch:
        - x64
    - target: deb
      arch:
        - x64
    - target: rpm
      arch:
        - x64
    - target: pacman
      arch:
        - x64
  icon: resources/icon/livepraise.png
  category: AudioVideo
  maintainer: Thiago de Lucena Sobrinho <thiagolucenaelvis@gmail.com>
  vendor: Cadimos
  synopsis: Software de projeção para igrejas
  description: Live Praise — operador, projetor, fila de mídia e transmissão ao vivo.
deb:
  priority: optional
  depends:
    - libgtk-3-0 | libgtk-4-1
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
rpm:
  depends:
    - gtk3
    - libnotify
    - nss
    - libXScrnSaver
    - libXtst
    - xdg-utils
    - at-spi2-atk
    - libuuid
pacman:
  depends:
    - gtk3
    - libnotify
    - nss
    - libxss
    - libxtst
    - xdg-utils
    - at-spi2-core
    - util-linux
flatpak:
  runtime: org.freedesktop.Platform
  runtimeVersion: '24.08'
  sdk: org.freedesktop.Sdk
  finishArgs:
    - --share=network
    - --share=ipc
    - --socket=pulseaudio
    - --socket=x11
    - --socket=wayland
    - --device=dri
    - --filesystem=home
  license: MIT
snap:
  confinement: strict
  grade: stable
mac:
  target:
    - target: dmg
      arch:
        - x64
        - arm64
  icon: resources/icon/livepraise.icns
  category: public.app-category.music

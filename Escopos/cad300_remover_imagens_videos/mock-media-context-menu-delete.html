<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>CAD-301 — Mock menu contextual biblioteca (excluir)</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            'lp-background': '#0f1419',
            'lp-surface': '#1a2332',
            'lp-text': '#e8edf4',
            'lp-muted': '#8b9cb3',
            'lp-primary': '#3b82f6',
          },
        },
      },
    };
  </script>
  <style>
    body { font-family: system-ui, sans-serif; }
    .viewport-label { position: fixed; top: 8px; left: 8px; z-index: 100; font-size: 11px; color: #8b9cb3; }
  </style>
</head>
<body class="min-h-screen bg-zinc-900">
  <p class="viewport-label" id="vp">1440×900 — biblioteca vídeos, menu com exclusão</p>

  <main class="flex h-screen flex-col gap-3 p-4 text-lp-text">
    <label class="text-xs uppercase tracking-wider text-lp-muted">Categoria</label>
    <select class="rounded-lg border border-lp-surface bg-lp-background px-3 py-2 text-sm">
      <option>culto</option>
    </select>

    <ul class="grid min-h-0 flex-1 grid-cols-3 gap-2 overflow-y-auto sm:grid-cols-4">
      <li>
        <div class="relative aspect-video w-full overflow-hidden rounded-lg border border-lp-surface bg-lp-surface/40">
          <div class="flex h-full items-center justify-center text-xs text-lp-muted">thumb</div>
        </div>
      </li>
      <li>
        <div class="relative aspect-video w-full overflow-hidden rounded-lg border border-lp-surface opacity-70">
          <div class="flex h-full items-center justify-center text-xs text-lp-muted">thumb</div>
          <span class="absolute inset-0 flex flex-col items-center justify-center gap-1 bg-black/60 text-xs font-medium text-white">
            <span class="inline-block h-5 w-5 animate-spin rounded-full border-2 border-white/30 border-t-white" aria-hidden="true"></span>
            42%
          </span>
        </div>
      </li>
      <li>
        <div class="relative aspect-video w-full overflow-hidden rounded-lg border border-lp-primary">
          <div class="h-full w-full bg-gradient-to-br from-slate-600 to-slate-800"></div>
        </div>
      </li>
    </ul>
  </main>

  <!-- Menu contextual to-be (tile vídeo ready, cursor ~centro do tile activo) -->
  <ul
    class="fixed z-[60] min-w-[14rem] rounded-md border border-lp-surface bg-lp-background py-1 text-sm text-lp-text shadow-lg"
    style="left: 58%; top: 48%;"
    role="menu"
  >
    <li>
      <button type="button" class="w-full px-3 py-2 text-left hover:bg-lp-surface" role="menuitem">
        Definir como fundo inicial
      </button>
    </li>
    <li>
      <button type="button" class="w-full px-3 py-2 text-left hover:bg-lp-surface" role="menuitem">
        Alterar fundo rápido
      </button>
    </li>
    <li>
      <button type="button" class="w-full px-3 py-2 text-left hover:bg-lp-surface" role="menuitem">
        Propriedades
      </button>
    </li>
    <li>
      <button type="button" class="w-full px-3 py-2 text-left hover:bg-lp-surface" role="menuitem">
        Mudar categoria
      </button>
    </li>
    <li>
      <button type="button" class="w-full px-3 py-2 text-left hover:bg-lp-surface" role="menuitem">
        Aplicar na fila
      </button>
    </li>
    <li role="separator" class="my-1 border-t border-lp-surface" aria-hidden="true"></li>
    <li>
      <button
        type="button"
        class="w-full px-3 py-2 text-left text-rose-400 transition hover:bg-rose-950/50 hover:text-rose-200"
        role="menuitem"
        aria-label="Excluir «culto-abertura.mp4» da biblioteca"
      >
        Excluir da biblioteca
      </button>
    </li>
  </ul>

  <!-- Estado alternativo: item desactivado (processing) — comentário no HTML -->
  <!--
  <ul class="fixed z-[60] ..." style="left: 24%; top: 48%;" role="menu">
    ...
    <li role="separator" class="my-1 border-t border-lp-surface"></li>
    <li>
      <button
        type="button"
        disabled
        title="Aguarde o processamento do vídeo terminar."
        class="w-full px-3 py-2 text-left text-rose-400/50 cursor-not-allowed opacity-50"
        role="menuitem"
        aria-disabled="true"
      >
        Excluir da biblioteca
      </button>
    </li>
  </ul>
  -->
</body>
</html>

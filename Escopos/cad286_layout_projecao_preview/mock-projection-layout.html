<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CAD-287 — Mock layout 3 zonas</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0f172a;
        color: #f8fafc;
        font-family: system-ui, sans-serif;
      }

      .toolbar {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        padding: 0.75rem 1rem;
        background: #1e293b;
        border-bottom: 1px solid #334155;
      }

      .toolbar button {
        padding: 0.35rem 0.75rem;
        border: 1px solid #475569;
        border-radius: 0.375rem;
        background: #334155;
        color: #f8fafc;
        cursor: pointer;
        font-size: 0.875rem;
      }

      .toolbar button[aria-pressed='true'] {
        border-color: #38bdf8;
        background: #0369a1;
      }

      .frame-wrap {
        display: flex;
        justify-content: center;
        padding: 1rem;
      }

      .frame {
        position: relative;
        width: min(100%, 1280px);
        aspect-ratio: 16 / 9;
        background: #000;
        overflow: hidden;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.45);
      }

      #stage {
        position: relative;
        width: 100%;
        height: 100%;
      }

      #text-scrim {
        position: absolute;
        inset: 0;
        z-index: 1;
        pointer-events: none;
        background: linear-gradient(
          180deg,
          rgba(0, 0, 0, 0.12) 0%,
          rgba(0, 0, 0, 0.42) 55%,
          rgba(0, 0, 0, 0.72) 100%
        );
      }

      #conteudo {
        position: relative;
        z-index: 2;
        color: #f8fafc;
        text-shadow: 0 1px 2px rgba(0, 0, 0, 0.65);
      }

      #last-action.footer-alert-visible {
        display: block;
        position: absolute;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 10;
        overflow: hidden;
        background: var(--footer-alert-bg, #000);
        color: var(--footer-alert-text-color, #fff);
        font-size: clamp(1rem, 2.5vw, 1.75rem);
        line-height: 1.2;
      }

      .footer-alert-track {
        display: flex;
        width: 100%;
        overflow: hidden;
        padding: 0.5rem 0;
      }

      .footer-alert-text {
        display: inline-block;
        white-space: nowrap;
        padding-left: 100%;
        animation: footer-alert-marquee 8s linear infinite;
      }

      @keyframes footer-alert-marquee {
        to {
          transform: translateX(-100%);
        }
      }

      .hint {
        padding: 0.5rem 1rem;
        font-size: 0.8rem;
        color: #94a3b8;
      }
    </style>
    <link rel="stylesheet" href="../../shared/projection-layout.css" />
  </head>
  <body>
    <div class="toolbar" role="toolbar" aria-label="Modo de pré-visualização">
      <button type="button" data-mode="biblia" aria-pressed="true">Bíblia</button>
      <button type="button" data-mode="louvor" aria-pressed="false">Louvor</button>
      <button type="button" id="toggle-alert" aria-pressed="false">footerAlert</button>
    </div>
    <p class="hint">
      Mock CAD-287 — 16:9. Comparar com mock-biblia-3-zonas.png / mock-louvor-3-zonas.png no board.
    </p>
    <div class="frame-wrap">
      <div class="frame">
        <div id="stage" data-has-content="true">
          <div id="text-scrim" aria-hidden="true"></div>
          <div id="conteudo" class="conteudo"></div>
          <footer id="last-action" aria-live="polite"></footer>
        </div>
      </div>
    </div>
    <script>
      const samples = {
        biblia: `<div class="titulo">Mateus 5:1</div>
<div class="content"><span>Bem-aventurados os pobres de espírito, porque deles é o reino dos céus.</span></div>
<div class="rodape"></div>`,
        louvor: `<div class="titulo"></div>
<div class="content"><span>// Primeira linha do verso<br />Segunda linha do verso</span></div>
<div class="rodape">Nome da música (Artista)</div>`,
      };

      const conteudo = document.getElementById('conteudo');
      const lastAction = document.getElementById('last-action');
      const buttons = document.querySelectorAll('[data-mode]');
      let mode = 'biblia';

      function render() {
        conteudo.innerHTML = samples[mode];
      }

      buttons.forEach((btn) => {
        btn.addEventListener('click', () => {
          mode = btn.dataset.mode;
          buttons.forEach((b) => b.setAttribute('aria-pressed', String(b === btn)));
          render();
        });
      });

      document.getElementById('toggle-alert').addEventListener('click', (e) => {
        const on = !document.body.classList.contains('footer-alert-active');
        document.body.classList.toggle('footer-alert-active', on);
        e.currentTarget.setAttribute('aria-pressed', String(on));
        if (on) {
          lastAction.classList.add('footer-alert-visible');
          lastAction.innerHTML =
            '<div class="footer-alert-track"><span class="footer-alert-text">Alerta de teste — igreja fecha em 10 minutos</span></div>';
        } else {
          lastAction.classList.remove('footer-alert-visible');
          lastAction.innerHTML = '';
        }
      });

      const params = new URLSearchParams(location.search);
      if (params.get('mode') === 'louvor') {
        document.querySelector('[data-mode="louvor"]').click();
      }

      render();
    </script>
  </body>
</html>

<div class="modal fade" id="new_music" tabindex="-1" role="dialog" aria-labelledby="new_musicLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="new_musicLabel">Nova Música</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label for="nome">Nome da Música</label>
                        <input type="text" class="form-control" id="nome" placeholder="Nome da Música">
                    </div>
                    <div class="form-group">
                        <label for="artista">Artista</label>
                        <input type="text" class="form-control" id="artista" placeholder="Artista">
                    </div>
                    <div class="form-group">
                        <label for="compositor">Compositor</label>
                        <input type="text" class="form-control" id="compositor" placeholder="Compositor">
                    </div>
                    <div class="form-group">
                        <label for="letra">Letra</label>
                        <textarea class="form-control" id="letra" rows="10"></textarea>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" id="button_salvar_musica">Salvar</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="conf_tela" tabindex="-1" role="dialog" aria-labelledby="conf_telaLabel" aria-hidden="true">
    <div class="modal-dialog" role="document">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="conf_telaLabel">Configuração de Tela</h5>
                <button type="button" class="close" data-dismiss="modal" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
            </div>
            <div class="modal-body">
                <form>
                    <div class="form-group">
                        <label for="tamanho_tela">Tamanho da Tela</label>
                        <select class="form-control" id="tamanho_tela">
                            <option value="1920x1080">1920x1080</option>
                            <option value="1280x720">1280x720</option>
                            <option value="800x600">800x600</option>
                            <option value="personalizado">Personalizado</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="largura">Largura</label>
                        <input type="number" class="form-control" id="largura" placeholder="Largura">
                    </div>
                    <div class="form-group">
                        <label for="altura">Altura</label>
                        <input type="number" class="form-control" id="altura" placeholder="Altura">
                    </div>
                    <div class="form-group">
                        <label for="cat_imagens">Categoria de Imagens</label>
                        <select class="form-control" id="cat_imagens">
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="cat_videos">Categoria de Vídeos</label>
                        <select class="form-control" id="cat_videos">
                        </select>
                    </div>
                </form>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-dismiss="modal">Fechar</button>
                <button type="button" class="btn btn-primary" id="button_ajustar_tela">Ajustar</button>
            </div>
        </div>
    </div>
</div>

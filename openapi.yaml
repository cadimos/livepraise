                additionalProperties: true
        '404':
          description: Tema não encontrado

  /themes/{themeId}/variables.css:
    get:
      tags: [themes]
      summary: Variáveis CSS do tema
      operationId: getThemeCss
      parameters:
        - $ref: '#/components/parameters/themeId'
      responses:
        '200':
          content:
            text/css:
              schema:
                type: string

  /themes/{themeId}/assets/{filename}:
    get:
      tags: [themes]
      summary: Asset estático do tema
      operationId: getThemeAsset
      parameters:
        - $ref: '#/components/parameters/themeId'
        - name: filename
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Ficheiro binário
        '403':
          description: Path traversal bloqueado
        '404':
          description: Asset não encontrado

  /locales:
    get:
      tags: [locales]
      summary: Locales disponíveis
      operationId: listLocales
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      type: string
                  default:
                    type: string
                    example: pt-BR

  /locales/{locale}.json:
    get:
      tags: [locales]
      summary: Mensagens i18n
      operationId: getLocaleMessages
      parameters:
        - name: locale
          in: path
          required: true
          schema:
            type: string
          example: pt-BR
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        '404':
          description: Locale não encontrado

  /api/system/error-log:
    get:
      tags: [system]
      summary: Listar entradas recentes do log de erros
      operationId: listErrorLog
      security:
        - bearerAuth: []
      description: |
        Requer acesso de operador (`requireOperatorAccess`).
        Em localhost o token é opcional; remoto exige sessão operator.
      parameters:
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Entradas mais recentes primeiro
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLogListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [system]
      summary: Registar erro (cliente ou smoke)
      operationId: appendErrorLog
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ErrorLogAppendRequest'
            examples:
              client:
                value:
                  level: error
                  source: client
                  message: Falha ao carregar playlist
                  detail: GET /playlist → HTTP 500
      responses:
        '201':
          description: Entrada criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorLogAppendResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags: [system]
      summary: Limpar log de erros
      operationId: clearErrorLog
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Arquivo zerado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
        '401':
          $ref: '#/components/responses/Unauthorized'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: session-token
      description: Token devolvido por POST /api/auth/login

  parameters:
    numericId:
      name: id
      in: path
      required: true
      schema:
        type: integer
    codigo:
      name: codigo
      in: path
      required: true
      schema:
        type: string
    themeId:
      name: themeId
      in: path
      required: true
      schema:
        type: string
    deviceId:
      name: deviceId
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: UUID v4 do dispositivo externo

  responses:
    BadRequest:
      description: Pedido inválido
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Unauthorized:
      description: Autenticação obrigatória ou sessão inválida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    Forbidden:
      description: Papel insuficiente
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'
    NotFound:
      description: Recurso não encontrado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorBody'

  schemas:
    ErrorBody:
      type: object
      required: [error]
      properties:
        error:
          type: string
      example:
        error: Credenciais inválidas

    StatusOk:
      type: object
      required: [status]
      properties:
        status:
          type: string
          example: Sucesso

    HealthModuleStatus:
      type: object
      required: [id, name, active]
      properties:
        id:
          type: string
        name:
          type: string
        active:
          type: boolean
        mount:
          type: string

    HealthResponse:
      type: object
      required: [status, phase, version, websocket, modules]
      properties:
        status:
          type: string
          enum: [ok, degraded]
        phase:
          type: string
        version:
          type: string
          description: Versão da aplicação (package.json)
        websocket:
          type: string
        features:
          type: object
          description: Capacidades do binário em execução
          properties:
            cad194:
              type: boolean
              description: Rotas CAD-194 (upload/YouTube para fila)
            cad228:
              type: boolean
              description: POST /api/queue/import-url (CAD-228)
        modules:
          type: array
          items:
            $ref: '#/components/schemas/HealthModuleStatus'

    QueueImportUrlRequest:
      type: object
      required: [url]
      properties:
        url:
          type: string
          format: uri
          example: https://cdn.exemplo.org/slide.png
        category:
          type: string
          default: remoto
          description: Pasta em imagens/ ou videos/; default remoto (não usa categoria dos painéis).
        mode:
          type: string
          enum: [download, reference]
          default: download

    QueueImportUrlResponse:
      type: object
      required: [status, mode, item]
      properties:
        status:
          type: string
          example: successo
        mode:
          type: string
          enum: [download, reference]
        item:
          type: object
          required: [kind, label, mediaPath]
          properties:
            kind:
              type: string
              enum: [image, video]
            label:
              type: string
            mediaPath:
              type: string
              description: Path relativo (download) ou URL absoluta (reference)
            thumbPath:
              type: string

    ErrorLogEntry:
      type: object
      required: [id, ts, level, source, message]
      properties:
        id:
          type: string
          format: uuid
        ts:
          type: string
          format: date-time
        level:
          type: string
          enum: [error, warn]
        source:
          type: string
          example: api
        message:
          type: string
        detail:
          type: string

    ErrorLogListResponse:
      type: object
      required: [status, items]
      properties:
        status:
          type: string
          example: Sucesso
        items:
          type: array
          items:
            $ref: '#/components/schemas/ErrorLogEntry'

    ErrorLogAppendRequest:
      type: object
      required: [message]
      properties:
        level:
          type: string
          enum: [error, warn]
          default: error
        source:
          type: string
          default: client
        message:
          type: string
        detail:
          type: string

    ErrorLogAppendResponse:
      type: object
      required: [status, entry]
      properties:
        status:
          type: string
          example: Sucesso
        entry:
          $ref: '#/components/schemas/ErrorLogEntry'

    PublicUser:
      type: object
      required: [id, username, role, active, createdAt, updatedAt]
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
          enum: [operator, remote, admin]
        active:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
          format: password

    LoginResponse:
      type: object
      required: [status, token, user]
      properties:
        status:
          type: string
        token:
          type: string
        user:
          $ref: '#/components/schemas/PublicUser'

    CreateUserRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
        password:
          type: string
        role:
          type: string
          enum: [operator, remote, admin]
          default: remote

    UpdateUserRequest:
      type: object
      properties:
        password:
          type: string
        role:
          type: string
          enum: [operator, remote, admin]
        active:
          type: boolean

    ChromeTabRequest:
      type: object
      required: [label]
      properties:
        label:
          type: string
        songId:
          type: integer
        songName:
          type: string

    ChromeTab:
      type: object
      properties:
        id:
          type: string
        label:
          type: string
        songId:
          type: integer
          nullable: true
        songName:
          type: string
          nullable: true
        userId:
          type: integer
        userName:
          type: string

    LiveRequestBody:
      type: object
      required: [kind, payload]
      properties:
        kind:
          type: string
          enum: [live-music, live-bible, live-video]
        payload:
          type: object
          additionalProperties: true

    ApprovalItem:
      type: object
      properties:
        id:
          type: string
        kind:
          type: string
        userName:
          type: string
        payload:
          type: object
          additionalProperties: true
        createdAt:
          type: string
          format: date-time
        status:
          type: string

    LiveAction:
      type: object
      required: [acao, valor]
      properties:
        acao:
          type: string
          enum:
            - background
            - texto
            - video
            - viewMusica
            - viewBiblia
            - removeConteudo
            - atualizar
            - ajustarTela
            - viewMusicaRetorno
            - viewBibliaRetorno
        valor:
          type: string

    DisplaysConfig:
      type: object
      required: [assignments, updatedAt]
      properties:
        assignments:
          type: array
          items:
            $ref: '#/components/schemas/DisplayAssignment'
        updatedAt:
          type: string
          format: date-time

    DisplayAssignment:
      type: object
      required: [displayId, label, role, bounds, primary]
      properties:
        displayId:
          type: integer
        label:
          type: string
        role:
          type: string
          enum: [operator, projection, stage-return, off]
        bounds:
          type: object
          required: [x, y, width, height]
          properties:
            x:
              type: number
            y:
              type: number
            width:
              type: number
            height:
              type: number
        primary:
          type: boolean

    SuccessItems:
      type: object
      properties:
        status:
          type: string
        items:
          type: array
          items:
            type: object
            additionalProperties: true

    MusicWriteBody:
      type: object
      required: [cat, nome, artista]
      properties:
        cat:
          type: string
        nome:
          type: string
        artista:
          type: string
        compositor:
          type: string

    MusicWriteResponse:
      type: object
      properties:
        status:
          type: string
        data:
          $ref: '#/components/schemas/MusicWriteBody'
        id:
          oneOf:
            - type: object
            - type: string
            - type: integer

    PlaylistResolveRequest:
      type: object
      required: [songIds]
      properties:
        songIds:
          type: array
          items:
            type: integer
            minimum: 1

    PlaylistResolveEntry:
      type: object
      required: [id, exists]
      properties:
        id:
          type: integer
        exists:
          type: boolean
        nome:
          type: string
        nome2:
          type: string
        artista:
          type: string

    PlaylistResolveResponse:
      type: object
      required: [status, items]
      properties:
        status:
          type: string
          example: Sucesso
        items:
          type: array
          items:
            $ref: '#/components/schemas/PlaylistResolveEntry'

    ExternalDevice:
      type: object
      required: [deviceId, profile, showChords, label, lastSeenAt]
      properties:
        deviceId:
          type: string
          format: uuid
        profile:
          type: string
          enum: [live, vocal, stage, player]
        showChords:
          type: boolean
        label:
          type: string
          nullable: true
        lastSeenAt:
          type: string
          format: date-time

    ExternalDeviceResponse:
      type: object
      required: [status, device]
      properties:
        status:
          type: string
          example: successo
        device:
          $ref: '#/components/schemas/ExternalDevice'

    ExternalDevicePatch:
      type: object
      properties:
        profile:
          type: string
          enum: [live, vocal, stage, player]
        showChords:
          type: boolean
        label:
          type: string
          nullable: true

    MediaPropertiesResponse:
      type: object
      required: [status, path, name, category, sizeBytes, sizeLabel, modifiedAt, extension]
      properties:
        status:
          type: string
          example: successo
        path:
          type: string
        name:
          type: string
        category:
          type: string
        sizeBytes:
          type: integer
        sizeLabel:
          type: string
        modifiedAt:
          type: string
          format: date-time
        extension:
          type: string

    MediaMoveRequest:
      type: object
      required: [path, toCategory]
      properties:
        path:
          type: string
        toCategory:
          type: string

    MediaDeleteRequest:
      type: object
      required: [path]
      properties:
        path:
          type: string
          description: Caminho relativo (ex. `imagens/slides/foto.jpg` ou `videos/clips/clip.mp4`)

    QuickBackgroundPatch:
      type: object
      required: [url, diretorio]
      properties:
        url:
          type: string
        diretorio:
          type: string
          enum: [imagens, videos]

    VideoListEntry:
      type: object
      required: [video, thumb, pipelineStatus, pipelinePercent]
      properties:
        video:
          type: string
        thumb:
          type: string
        pipelineStatus:
          type: string
          enum: [ready, processing, error]
        pipelinePercent:
          type: integer
          minimum: 0
          maximum: 100
        pipelineError:
          type: string

  x-websocket:
    /ws/live:
      summary: Hub de projeção ao vivo
      description: |
        Protocolo JSON sobre WebSocket (`ws` library). Após `connect`, o cliente deve enviar `join`.

        **Papéis (`role`):** `operator`, `projector`, `stage-return`, `remote-operator`, `live-viewer`.

        **Mensagens cliente → servidor:**
        - `{ "type": "join", "role": "...", "name": "...", "token": "..." }`
        - `{ "type": "live-action", "action": { "acao": "background", "valor": "..." } }` (operador local)
        - `{ "type": "set-frozen", "frozen": true }`
        - `{ "type": "ping" }`

        **Mensagens servidor → cliente:**
        - `joined`, `live-action`, `state-sync`, `pong`, `error`
        - `chrome-tab-added`, `approval-pending`, `approval-resolved` (integração remota)

        Remotos não enviam `live-action` directamente — usar `POST /api/remote/live-request`.
      examples:
        joinOperator:
          value:
            type: join
            role: operator
            name: operador
        liveAction:
          value:
            type: live-action
            action:
              acao: viewMusica
              valor: '10|0'
        joinedResponse:
          value:
            type: joined
            clientId: c1
            role: projector
            state:
              frozen: false
              lastAction: null
              lastStageAction: null
              revision: 0

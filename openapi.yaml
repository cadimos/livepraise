openapi: 3.1.0
info:
  title: Livepraise API
  version: 1.0.0-alpha.2
  description: |
    API HTTP do servidor Livepraise (Electron + Express).

    - **Autenticação:** `Authorization: Bearer <token>` (sessão criada em `POST /api/auth/login`).
    - **Operador local:** requisições de `localhost` podem aceder a rotas `requireOperatorAccess` sem token.
    - **WebSocket ao vivo:** `ws://{host}/ws/live` — ver tag `websocket`.
  contact:
    name: Cadimos
    url: https://github.com/cadimos/livepraise

servers:
  - url: http://localhost:3000
    description: Desenvolvimento local (porta padrão)

tags:
  - name: system
    description: Saúde e metadados
  - name: auth
    description: Sessões e login
  - name: users
    description: Gestão de utilizadores (operador)
  - name: remote
    description: Remoto — Chrome tabs e fila de aprovação
  - name: music
    description: Catálogo de louvores
  - name: bible
    description: Bíblias instaladas (SQLite por ficheiro)
  - name: media
    description: Imagens e vídeos locais
  - name: display
    description: Configuração de ecrã (tabela `tela`)
  - name: displays
    description: Atribuição de monitores (Electron)
  - name: themes
    description: Temas visuais
  - name: locales
    description: Traduções i18n
  - name: queue
    description: Importação de mídia para a fila (upload, YouTube, URL)
  - name: playlist
    description: Resolução de músicas para importação de playlist
  - name: devices
    description: Dispositivos externos (live, vocal, stage, player)
  - name: websocket
    description: Hub WebSocket `/ws/live`

paths:
  /health:
    get:
      tags: [system]
      summary: Estado do servidor
      operationId: getHealth
      responses:
        '200':
          description: Servidor activo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              examples:
                ok:
                  value:
                    status: ok
                    phase: release
                    version: 1.0.0-alpha.2
                    websocket: /ws/live
                    modules:
                      - id: database
                        name: Base de dados (SQLite)
                        active: true
                        mount: dsw.bd
                      - id: websocket
                        name: Hub WebSocket ao vivo
                        active: true
                        mount: /ws/live

  /api/queue/import-url:
    post:
      tags: [queue]
      summary: Importar imagem ou vídeo na fila a partir de URL HTTP(S)
      operationId: postQueueImportUrl
      description: |
        Modo `download` (default): o servidor descarrega o ficheiro com validação SSRF,
        limites de tamanho (50 MB imagem / 600 MB vídeo) e timeout (60 s).
        Modo `reference`: devolve a URL HTTPS sem fetch server-side.
        URLs YouTube devem usar `POST /api/queue/youtube`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueImportUrlRequest'
      responses:
        '200':
          description: Item pronto para a fila
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueImportUrlResponse'
        '400':
          description: URL inválida, SSRF, tipo não suportado ou YouTube
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'
        '409':
          description: Ficheiro com o mesmo nome já existe na categoria
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /video/importar/url:
    post:
      tags: [queue]
      summary: Alias legado de import-url (vídeo)
      operationId: postVideoImportUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueImportUrlRequest'
      responses:
        '200':
          description: Ver POST /api/queue/import-url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueImportUrlResponse'

  /imagem/importar/url:
    post:
      tags: [queue]
      summary: Alias legado de import-url (imagem)
      operationId: postImageImportUrl
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/QueueImportUrlRequest'
      responses:
        '200':
          description: Ver POST /api/queue/import-url
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QueueImportUrlResponse'

  /fonts/{familia}/{fileName}:
    get:
      tags: [fonts]
      summary: Ficheiro de fonte embutida (público na LAN)
      description: |
        Serve apenas ficheiros listados em `resources/fonts/manifest.json`.
        Sem autenticação — necessário para `@font-face` em projetor e clientes `/live`.
      operationId: getBundledFontFile
      parameters:
        - name: familia
          in: path
          required: true
          schema:
            type: string
            example: roboto
        - name: fileName
          in: path
          required: true
          schema:
            type: string
            example: Roboto-Regular.woff2
      responses:
        '200':
          description: Ficheiro de fonte
          headers:
            Cache-Control:
              schema:
                type: string
          content:
            font/woff2:
              schema:
                type: string
                format: binary
            font/woff:
              schema:
                type: string
                format: binary
            font/ttf:
              schema:
                type: string
                format: binary
            font/otf:
              schema:
                type: string
                format: binary
        '404':
          description: Família ou ficheiro não permitido

  /api/system/fonts:
    get:
      tags: [system]
      summary: Fontes instaladas no sistema operativo
      operationId: listSystemFonts
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista deduplicada (sem paths absolutos)
          content:
            application/json:
              schema:
                type: object
                required: [status, items]
                properties:
                  status:
                    type: string
                    example: successo
                  items:
                    type: array
                    items:
                      type: object
                      required: [family, localizedName]
                      properties:
                        family:
                          type: string
                        localizedName:
                          type: string
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/system/local-ip:
    get:
      tags: [system]
      summary: IPv4 local principal da máquina
      operationId: getLocalIp
      responses:
        '200':
          description: Endereço IPv4 não-loopback (ou null se indisponível)
          content:
            application/json:
              schema:
                type: object
                required: [status, ipv4]
                properties:
                  status:
                    type: string
                    example: successo
                  ipv4:
                    type: string
                    nullable: true
                    example: 192.168.1.42

  /api/docs/openapi.yaml:
    get:
      tags: [system]
      summary: Especificação OpenAPI (este ficheiro)
      operationId: getOpenApiSpec
      responses:
        '200':
          description: YAML OpenAPI 3.1
          content:
            application/yaml:
              schema:
                type: string

  /api/docs:
    get:
      tags: [system]
      summary: Swagger UI (documentação interactiva)
      operationId: getOpenApiUi
      responses:
        '200':
          description: Página HTML com Swagger UI
          content:
            text/html:
              schema:
                type: string

  /api/auth/login:
    post:
      tags: [auth]
      summary: Iniciar sessão
      operationId: authLogin
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            examples:
              operator:
                value:
                  username: admin
                  password: changeme
      responses:
        '200':
          description: Sessão criada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              examples:
                success:
                  value:
                    status: Sucesso
                    token: 7f3c2a1b9e8d4f6a0c1b2e3d4f5a6b7
                    user:
                      id: 1
                      username: admin
                      role: operator
                      active: true
                      createdAt: '2026-01-01T00:00:00.000Z'
                      updatedAt: '2026-01-01T00:00:00.000Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Rate limit (20 tentativas / minuto por IP)

  /api/auth/logout:
    post:
      tags: [auth]
      summary: Terminar sessão
      operationId: authLogout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Sessão revogada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StatusOk'
              examples:
                success:
                  value:
                    status: Sucesso
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/me:
    get:
      tags: [auth]
      summary: Utilizador da sessão actual
      operationId: authMe
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Perfil público
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status:
                    type: string
                    example: Sucesso
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/auth/session:
    get:
      tags: [auth]
      summary: Validar token Bearer
      operationId: authSession
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token válido
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status:
                    type: string
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/users:
    get:
      tags: [users]
      summary: Listar utilizadores
      operationId: listUsers
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de utilizadores
          content:
            application/json:
              schema:
                type: object
                required: [status, users]
                properties:
                  status:
                    type: string
                  users:
                    type: array
                    items:
                      $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [users]
      summary: Criar utilizador
      operationId: createUser
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
            examples:
              remote:
                value:
                  username: celular1
                  password: segredo123
                  role: remote
      responses:
        '201':
          description: Utilizador criado
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status:
                    type: string
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Utilizador já existe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorBody'

  /api/users/{id}:
    patch:
      tags: [users]
      summary: Actualizar utilizador
      operationId: updateUser
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/numericId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUserRequest'
            examples:
              deactivate:
                value:
                  active: false
      responses:
        '200':
          description: Utilizador actualizado
          content:
            application/json:
              schema:
                type: object
                required: [status, user]
                properties:
                  status:
                    type: string
                  user:
                    $ref: '#/components/schemas/PublicUser'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/remote/chrome-tab:
    post:
      tags: [remote]
      summary: Registar separador Chrome (remoto)
      operationId: remoteChromeTab
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChromeTabRequest'
            examples:
              tab:
                value:
                  label: Louvor — Grande é o Senhor
                  songId: 42
                  songName: Grande é o Senhor
      responses:
        '201':
          description: Separador registado (broadcast WS `chrome-tab-added`)
          content:
            application/json:
              schema:
                type: object
                required: [status, tab]
                properties:
                  status:
                    type: string
                  tab:
                    $ref: '#/components/schemas/ChromeTab'
        '400':
          $ref: '#/components/responses/BadRequest'
        '403':
          $ref: '#/components/responses/Forbidden'

  /api/remote/live-request:
    post:
      tags: [remote]
      summary: Pedido ao vivo para aprovação do operador
      operationId: remoteLiveRequest
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LiveRequestBody'
            examples:
              music:
                value:
                  kind: live-music
                  payload:
                    songId: 10
                    verseIndex: 0
      responses:
        '202':
          description: Pedido enfileirado (broadcast WS `approval-pending`)
          content:
            application/json:
              schema:
                type: object
                required: [status, approval]
                properties:
                  status:
                    type: string
                  approval:
                    $ref: '#/components/schemas/ApprovalItem'
        '400':
          $ref: '#/components/responses/BadRequest'

  /api/remote/chrome-tabs:
    get:
      tags: [remote]
      summary: Separadores Chrome pendentes (operador)
      operationId: listChromeTabs
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Lista de tabs não consumidas
          content:
            application/json:
              schema:
                type: object
                required: [status, tabs]
                properties:
                  status:
                    type: string
                  tabs:
                    type: array
                    items:
                      $ref: '#/components/schemas/ChromeTab'

  /api/remote/chrome-tabs/{id}/consume:
    post:
      tags: [remote]
      summary: Consumir separador Chrome
      operationId: consumeChromeTab
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Tab consumida
          content:
            application/json:
              schema:
                type: object
                required: [status, tab]
                properties:
                  status:
                    type: string
                  tab:
                    $ref: '#/components/schemas/ChromeTab'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/remote/approvals/pending:
    get:
      tags: [remote]
      summary: Pedidos ao vivo pendentes
      operationId: listPendingApprovals
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Fila de aprovação
          content:
            application/json:
              schema:
                type: object
                required: [status, items]
                properties:
                  status:
                    type: string
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ApprovalItem'

  /api/remote/approvals/{id}/approve:
    post:
      tags: [remote]
      summary: Aprovar pedido remoto
      operationId: approveRemoteRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Aprovado e aplicado no hub (se aplicável)
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  approval:
                    $ref: '#/components/schemas/ApprovalItem'
                  liveAction:
                    $ref: '#/components/schemas/LiveAction'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/remote/approvals/{id}/reject:
    post:
      tags: [remote]
      summary: Rejeitar pedido remoto
      operationId: rejectRemoteRequest
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Rejeitado
          content:
            application/json:
              schema:
                type: object
                required: [status, approval]
                properties:
                  status:
                    type: string
                  approval:
                    $ref: '#/components/schemas/ApprovalItem'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/devices:
    get:
      tags: [devices]
      summary: Listar dispositivos externos registados
      operationId: listExternalDevices
      responses:
        '200':
          description: Dispositivos ordenados por última actividade
          content:
            application/json:
              schema:
                type: object
                required: [status, devices]
                properties:
                  status:
                    type: string
                    example: successo
                  devices:
                    type: array
                    items:
                      $ref: '#/components/schemas/ExternalDevice'

  /api/devices/{deviceId}:
    get:
      tags: [devices]
      summary: Obter ou registar dispositivo externo
      description: |
        Com `?profile=live|vocal|stage|player` cria ou actualiza o registo.
        Sem profile, devolve o dispositivo existente (404 se nunca registado).
      operationId: getExternalDevice
      parameters:
        - $ref: '#/components/parameters/deviceId'
        - name: profile
          in: query
          schema:
            type: string
            enum: [live, vocal, stage, player]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags: [devices]
      summary: Actualizar preferências do dispositivo
      operationId: patchExternalDevice
      parameters:
        - $ref: '#/components/parameters/deviceId'
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExternalDevicePatch'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExternalDeviceResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /musica/categoria:
    get:
      tags: [music]
      summary: Categorias de música
      operationId: listMusicCategories
      responses:
        '200':
          description: Categorias
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessItems'
              examples:
                categories:
                  value:
                    status: Sucesso
                    items:
                      - id: 1
                        nome: Adoração

  /musica/categoria/{codigo}:
    get:
      tags: [music]
      summary: Músicas por categoria
      operationId: listMusicByCategory
      parameters:
        - $ref: '#/components/parameters/codigo'
      responses:
        '200':
          description: Lista de músicas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessItems'

  /musica/verso/{codigo}:
    get:
      tags: [music]
      summary: Versos de uma música
      operationId: listMusicVerses
      parameters:
        - $ref: '#/components/parameters/codigo'
      responses:
        '200':
          description: Versos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessItems'

  /musica/{codigo}:
    get:
      tags: [music]
      summary: Música por ID
      operationId: getMusicById
      parameters:
        - $ref: '#/components/parameters/codigo'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessItems'
    post:
      tags: [music]
      summary: Actualizar música
      operationId: updateMusic
      parameters:
        - $ref: '#/components/parameters/codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicWriteBody'
      responses:
        '200':
          description: Música actualizada (versos antigos removidos)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicWriteResponse'
    delete:
      tags: [music]
      summary: Eliminar música e versos
      operationId: deleteMusic
      parameters:
        - $ref: '#/components/parameters/codigo'
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  id:
                    type: string

  /musica:
    post:
      tags: [music]
      summary: Criar música
      operationId: createMusic
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MusicWriteBody'
            examples:
              newSong:
                value:
                  cat: '1'
                  nome: Novo louvor
                  artista: Autor
                  compositor: ''
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicWriteResponse'

  /musica/verso:
    post:
      tags: [music]
      summary: Adicionar verso
      operationId: createMusicVerse
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [musica, verso]
              properties:
                musica:
                  type: string
                verso:
                  type: string
            examples:
              verse:
                value:
                  musica: '42'
                  verso: 'Linha 1 do coro'
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MusicWriteResponse'

  /playlist/resolve:
    post:
      tags: [playlist]
      summary: Verificar existência de músicas na BD local
      description: Usado na importação cross-instalação de playlists (chrome tabs).
      operationId: resolvePlaylistSongs
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PlaylistResolveRequest'
            examples:
              ids:
                value:
                  songIds: [1, 42, 99]
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PlaylistResolveResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /biblias:
    get:
      tags: [bible]
      summary: Bíblias instaladas
      operationId: listBibles
      responses:
        '200':
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  biblias:
                    type: array
                    items:
                      type: object
                      properties:
                        nome:
                          type: string
                        arquivo:
                          type: string
              examples:
                list:
                  value:
                    status: successo
                    biblias:
                      - nome: Almeida Revista e Atualizada
                        arquivo: ara.sqlite

  /biblias/livros/{biblia}:
    get:
      tags: [bible]
      summary: Livros de uma bíblia
      operationId: listBibleBooks
      parameters:
        - name: biblia
          in: path
          required: true
          schema:
            type: string
          description: Nome do ficheiro SQLite (ex. `ara.sqlite`)
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessItems'
        '400':
          $ref: '#/components/responses/BadRequest'

  /biblias/capitulo/{biblia}/{livro}:
    get:
      tags: [bible]
      summary: Contagem de capítulos
      operationId: listBibleChapters
      parameters:
        - name: biblia
          in: path
          required: true
          schema:
            type: string
        - name: livro
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          content:
            application/json:

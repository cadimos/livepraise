                  assignments:
                    - displayId: 1
                      label: HDMI-1
                      role: projection
                      bounds:
                        x: 1920
                        y: 0
                        width: 1920
                        height: 1080
                      primary: false
                  updatedAt: '2026-05-25T12:00:00.000Z'
      responses:
        '200':
          content:

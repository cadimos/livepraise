<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Praise — Live</title>
    <link rel="stylesheet" href="live.css" />
  </head>
  <body>
    <div id="stage">
      <div id="bg-layer">
        <img id="bg-image" alt="" hidden />
        <div id="video-wrap" hidden>
          <video id="player" muted loop autoplay playsinline></video>
        </div>
      </div>
      <div id="conteudo" class="conteudo"></div>
    </div>
    <footer id="last-action" aria-live="polite"></footer>
    <script type="module" src="live.js"></script>
  </body>
</html>

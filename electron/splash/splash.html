<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Live Praise</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        background: linear-gradient(145deg, #0f172a 0%, #1e293b 100%);
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .splash {
        text-align: center;
        padding: 1.5rem 2rem;
        width: 100%;
        max-width: 480px;
      }

      .logo {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: 0.02em;
        margin-bottom: 0.35rem;
      }

      .tagline {
        color: #94a3b8;
        font-size: 0.9rem;
        margin-bottom: 1.5rem;
      }

      .progress {
        position: relative;
        width: 100%;
        height: 8px;
        margin: 0 auto 0.85rem;
        overflow: hidden;
        border-radius: 999px;
        background: #1e293b;
        box-shadow: inset 0 0 0 1px #334155;
      }

      .progress-bar {
        height: 100%;
        width: 8%;
        border-radius: inherit;
        background: linear-gradient(90deg, #0ea5e9, #38bdf8);
        transition: width 0.55s ease;
      }

      .progress-bar.is-ready {
        width: 100%;
      }

      .status {
        min-height: 1.25rem;
        margin-bottom: 0.35rem;
        font-size: 0.88rem;
        color: #cbd5e1;
      }

      .version {
        margin-bottom: 1rem;
        font-size: 0.72rem;
        color: #64748b;
      }

      .monitors {
        list-style: none;
        text-align: left;
        border: 1px solid #334155;
        border-radius: 0.5rem;
        padding: 0.5rem 0;
        background: rgba(15, 23, 42, 0.6);
        max-height: 160px;
        overflow-y: auto;
      }

      .monitors li {
        display: flex;
        justify-content: space-between;
        gap: 0.75rem;
        padding: 0.35rem 0.75rem;
        font-size: 0.8rem;
        color: #cbd5e1;
      }

      .monitors .role {
        color: #38bdf8;
        text-transform: capitalize;
        white-space: nowrap;
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo">Live Praise</div>
      <p class="tagline" id="tagline">Software de projeção para igrejas</p>
      <div
        class="progress"
        id="progress"
        role="progressbar"
        aria-valuemin="0"
        aria-valuemax="100"
        aria-valuenow="8"
        aria-labelledby="status"
      >
        <div class="progress-bar" id="progress-bar"></div>
      </div>
      <p class="status" id="status" aria-live="polite">Carregando imagens…</p>
      <p class="version" id="version"></p>
      <ul class="monitors" id="monitors" hidden></ul>
    </div>
    <script>
      const COPY = {
        'pt-BR': {
          tagline: 'Software de projeção para igrejas',
          ready: 'Abrindo o operador…',
          monitors: '{count} monitor(es) detectado(s)',
          roles: {
            operator: 'Operador',
            projection: 'Projeção',
            'stage-return': 'Retorno de palco',
            off: 'Desligado',
          },
          steps: [
            'Carregando imagens…',
            'Carregando vídeos…',
            'Carregando louvores…',
            'Carregando versões da Bíblia…',
            'Carregando livros da Bíblia…',
            'Carregando temas…',
            'Preparando a fila de projeção…',
            'Acesso na rede iniciando…',
            'Aplicando configurações…',
            'Configurando monitores…',
          ],
        },
        'pt-PT': {
          tagline: 'Software de projeção para igrejas',
          ready: 'A abrir o operador…',
          monitors: '{count} monitor(es) detetado(s)',
          roles: {
            operator: 'Operador',
            projection: 'Projeção',
            'stage-return': 'Retorno de palco',
            off: 'Desligado',
          },
          steps: [
            'A carregar imagens…',
            'A carregar vídeos…',
            'A carregar louvores…',
            'A carregar versões da Bíblia…',
            'A carregar livros da Bíblia…',
            'A carregar temas…',
            'A preparar a fila de projeção…',
            'A iniciar o acesso na rede…',
            'A aplicar configurações…',
            'A configurar monitores…',
          ],
        },
        'en-US': {
          tagline: 'Church projection software',
          ready: 'Opening the operator…',
          monitors: '{count} monitor(s) detected',
          roles: {
            operator: 'Operator',
            projection: 'Projection',
            'stage-return': 'Stage return',
            off: 'Off',
          },
          steps: [
            'Loading images…',
            'Loading videos…',
            'Loading songs…',
            'Loading Bible translations…',
            'Loading Bible books…',
            'Loading themes…',
            'Preparing the projection queue…',
            'Starting network access…',
            'Applying settings…',
            'Configuring monitors…',
          ],
        },
        'es-ES': {
          tagline: 'Software de proyección para iglesias',
          ready: 'Abriendo el operador…',
          monitors: '{count} monitor(es) detectado(s)',
          roles: {
            operator: 'Operador',
            projection: 'Proyección',
            'stage-return': 'Retorno de escenario',
            off: 'Apagado',
          },
          steps: [
            'Cargando imágenes…',
            'Cargando vídeos…',
            'Cargando alabanzas…',
            'Cargando versiones de la Biblia…',
            'Cargando libros de la Biblia…',
            'Cargando temas…',
            'Preparando la cola de proyección…',
            'Iniciando el acceso en red…',
            'Aplicando ajustes…',
            'Configurando monitores…',
          ],
        },
      };

      function resolveLocale() {
        const nav = (navigator.language || 'pt-BR').toLowerCase();
        if (nav.startsWith('es')) return 'es-ES';
        if (nav.startsWith('en')) return 'en-US';
        if (nav === 'pt-pt' || nav.startsWith('pt-pt')) return 'pt-PT';
        return 'pt-BR';
      }

      const locale = resolveLocale();
      const copy = COPY[locale] ?? COPY['pt-BR'];
      document.documentElement.lang = locale;

      const status = document.getElementById('status');
      const tagline = document.getElementById('tagline');
      const version = document.getElementById('version');
      const list = document.getElementById('monitors');
      const progress = document.getElementById('progress');
      const bar = document.getElementById('progress-bar');
      const steps = copy.steps;
      const STEP_MS = 1400;
      const MAX_WAIT_PERCENT = 94;

      tagline.textContent = copy.tagline;
      let stepIndex = 0;
      let ready = false;
      let ticker = 0;

      function setProgress(percent) {
        const value = Math.max(6, Math.min(100, Math.round(percent)));
        bar.style.width = `${value}%`;
        progress.setAttribute('aria-valuenow', String(value));
      }

      function progressForTick(tick) {
        if (tick < steps.length) {
          return 8 + (tick / Math.max(1, steps.length - 1)) * 72;
        }
        return Math.min(MAX_WAIT_PERCENT, 80 + (tick - steps.length + 1) * 1.4);
      }

      function showStep(tick) {
        if (ready) return;
        const message = steps[Math.min(tick, steps.length - 1)];
        status.textContent = message;
        setProgress(progressForTick(tick));
      }

      function markReady() {
        if (ready) return;
        ready = true;
        status.textContent = copy.ready;
        bar.classList.add('is-ready');
        setProgress(100);
      }

      showStep(0);
      const timer = setInterval(() => {
        if (ready) {
          clearInterval(timer);
          return;
        }
        ticker += 1;
        showStep(ticker);
      }, STEP_MS);

      if (window.livepraise) {
        version.textContent = `Live Praise v${window.livepraise.version}`;
        window.livepraise.onDisplays((displays) => {
          list.hidden = false;
          list.innerHTML = '';
          for (const d of displays) {
            const li = document.createElement('li');
            const role = copy.roles[d.role] ?? d.role;
            li.innerHTML = `<span>${d.label}${d.primary ? ' ★' : ''}</span><span class="role">${role}</span>`;
            list.appendChild(li);
          }
        });
        if (typeof window.livepraise.onSplashReady === 'function') {
          window.livepraise.onSplashReady(markReady);
        }
      }
    </script>
  </body>
</html>
